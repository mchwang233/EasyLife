# ============================================================================
#  EasyLife —— 挂在 mch.wang 现有站点 /todos 路径下（路径模式，默认推荐）
#
#  本文件**不是**独立站点，只含两个 location，必须在现有 mch.wang 的 server 块内被 include：
#      server {
#          server_name mch.wang;
#          include /etc/nginx/easylife/todos-location.conf; # managed-by-easylife-deploy
#          ...
#      }
#  deploy.sh --mode path 会把它渲染到 /etc/nginx/easylife/todos-location.conf
#  （刻意不放进 conf.d/ 或 sites-enabled/：那两处会被 http 上下文整体 include，
#   location 出现在 http 上下文里会让 nginx -t 失败），并在 80/443 两个 server 块里各插入
#  上面那一行 include。--rollback 会删除该行并恢复备份。
#
#  端口：应用只监听 127.0.0.1:8086；deploy.sh --port <端口> 会同步替换下面的 8086。
#  环境文件需配合：EASYLIFE_BASE_PATH=/todos、PUBLIC_URL=https://mch.wang/todos
# ============================================================================

# 本行在 server 级生效（include 插在 server 块最前面）：break 终止后续 server 级 rewrite/if，
# 防止站点原有的 `if (!-e $request_filename) { rewrite ^(.*)$ /index.php$1 last; }`
# 在 location 匹配之前就把 /todos/... 改写到 PHP（表现为 404）。URI 本身保持不变。
rewrite ^/todos(/.*)?$ $uri break;

# /todos（无尾斜杠）跳到 /todos/，相对路径的静态资源与 ./api/ 才能解析到 /todos/ 下
location = /todos {
    return 301 /todos/;
}

# proxy_pass 末尾带 "/"：nginx 剥掉 /todos 前缀后转发（/todos/api/me -> /api/me）。
# 使用 ^~：命中这个前缀后不再匹配正则 location，避免现有站点里诸如
# location ~* \.(js|css)$ 的静态规则把 /todos/static/app.js 抢走。
location ^~ /todos/ {
    proxy_pass            http://127.0.0.1:8086/;
    proxy_http_version    1.1;
    proxy_set_header      Host               $host;
    proxy_set_header      X-Real-IP          $remote_addr;
    proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto  $scheme;
    proxy_set_header      X-Forwarded-Host   $host;
    proxy_set_header      X-Forwarded-Prefix /todos;
    proxy_set_header      Connection         "";
    client_max_body_size  6m;   # 任务图片上传（应用限制单张 5 MB）
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
}
