# ============================================================================
#  EasyLife 的 nginx 配置（仅供新增，绝不修改任何既有站点配置）
#  安装位置：/etc/nginx/conf.d/easylife.conf   （由 deploy/deploy.sh 幂等写入，
#            也可以 sudo cp deploy/nginx-easylife.conf /etc/nginx/conf.d/easylife.conf）
#  校验：    sudo nginx -t   然后  sudo systemctl reload nginx
#  ---------------------------------------------------------------------------
#  【重要】mch.wang 上已经运行着别的站点，不要覆盖它。两种方案：
#
#   路径模式（默认推荐）：https://mch.wang/todos/ —— **不用本文件**，改用
#                  deploy/nginx-easylife-location.conf（只含 location）：
#                  sudo bash deploy/deploy.sh            # 默认 --mode path
#                  脚本在 mch.wang 现有 server 块（80/443）里各插一行 include，先备份、nginx -t
#                  通过才 reload，失败恢复备份；--rollback 删除 include 行并恢复。无需新增 DNS。
#
#   子域模式：使用子域 easylife.mch.wang —— 就是本文件（只改下方 server_name 一行；
#                  用 deploy.sh --mode subdomain --domain <域名> 安装时脚本会自动替换）。
#                  需要一条 DNS 记录：  easylife.mch.wang  A  <服务器公网 IP>
#
#   两种方案彼此不冲突，也可以同时存在；但**绝对不要**用本文件覆盖已有的
#   /etc/nginx/conf.d/*.conf 或 sites-enabled 站点配置。
#
#  ---------------------------------------------------------------------------
#  本文件含两个互斥的 server 块，用 EASYLIFE_BLOCK 标记标出；deploy.sh 首次安装时会按
#  证书是否存在只保留其中一个：
#     EASYLIFE_BLOCK: SSL  —— 已有证书（/etc/letsencrypt/live/<域名>/fullchain.pem）
#                              时保留：443 + TLS + 反向代理；
#     EASYLIFE_BLOCK: HTTP —— 首次部署、尚无证书时保留：80 明文 + 反向代理，
#                              用于跑通 http-01 校验；随后 certbot --nginx 会把它改写成
#                              443 + 证书 + 80→443 跳转。
#  文件已存在时 deploy.sh 绝不会重写它（避免覆盖 certbot 的改动）。
# ============================================================================

# ---------------------------------------------------------------------------
# 访问日志遮蔽订阅 token：/api/calendar.ics?token=xxxx 只记录成 token=REDACTED，
# 避免日历订阅令牌落进日志文件。（map / log_format 属于 http 上下文，放在 conf.d 里合法。
#  若采用路径模式、不安装本文件，可把这两段单独存成 /etc/nginx/conf.d/easylife-log.conf。）
# ---------------------------------------------------------------------------
map $request_uri $easylife_log_uri {
    default            $request_uri;
    "~*(token=)[^&]+"  "$1REDACTED";
}

log_format easylife_redacted '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $easylife_log_uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# >>> EASYLIFE_BLOCK: SSL
server {
    listen      443 ssl http2;
    # IPv6 可用时取消下一行注释（服务器未启用 IPv6 请保持注释，否则 reload 会失败）：
    # listen    [::]:443 ssl http2;

    # server_name 可配置：改成自己的域名（deploy.sh --domain <域名> 会自动替换这一行）
    server_name easylife.mch.wang;

    server_tokens off;

    access_log /var/log/nginx/easylife-access.log easylife_redacted;
    error_log  /var/log/nginx/easylife-error.log warn;

    # 证书由 certbot --nginx -d <域名> 自动申请/续期；换成自备证书时改这两行即可。
    ssl_certificate     /etc/letsencrypt/live/easylife.mch.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easylife.mch.wang/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 6m;   # 任务图片上传（应用限制单张 5 MB）

    # 应用只监听回环 127.0.0.1:8086；端口被占用时改这里 + 环境文件 EASYLIFE_PORT。
    location / {
        proxy_pass         http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # 日历订阅（token 在 URL 里）：单独日志文件，便于排查日历客户端拉取问题
    location = /api/calendar.ics {
        access_log /var/log/nginx/easylife-ics.log easylife_redacted;
        proxy_pass         http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
# <<< EASYLIFE_BLOCK: END

# >>> EASYLIFE_BLOCK: HTTP
# 首次部署、尚无 TLS 证书时的引导块：先让域名能访问、能通过 http-01 校验。
# 跑过  sudo certbot --nginx -d <域名>  之后，本块会被 certbot 改写为
#   listen 443 ssl; + return 301 https://$host$request_uri;（即 80→443 跳转）。
# 如果这个 80 端口已被既有站点用作 default_server，本块也不会影响它（server_name 精确匹配）。
server {
    listen      80;
    # listen    [::]:80;

    server_name easylife.mch.wang;

    server_tokens off;

    access_log /var/log/nginx/easylife-access.log easylife_redacted;
    error_log  /var/log/nginx/easylife-error.log warn;

    client_max_body_size 6m;   # 任务图片上传（应用限制单张 5 MB）

    location / {
        proxy_pass         http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    location = /api/calendar.ics {
        access_log /var/log/nginx/easylife-ics.log easylife_redacted;
        proxy_pass         http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_read_timeout 30s;
    }
}
# <<< EASYLIFE_BLOCK: END

# ---------------------------------------------------------------------------
# 手工版路径模式（不想让 deploy.sh 自动插入 include 时）：在 mch.wang **已有的 server 块内部**追加如下片段
# （等价于 deploy/nginx-easylife-location.conf；自动方式见文件头）
# （只加 location，不改动它的 listen / server_name / root / 其它 location）。
# 同时在环境文件里设置 EASYLIFE_BASE_PATH=/todos、PUBLIC_URL=https://mch.wang/todos。
#
#     # ---- EasyLife（路径前缀 /todos/）----
#     # 写法 1：proxy_pass 末尾带 "/"，nginx 剥掉 /todos 前缀后转发；
#     # 写法 2：proxy_pass http://127.0.0.1:8086;（末尾无 "/"）原样带前缀转发。
#     # 应用设置了 EASYLIFE_BASE_PATH 后两种写法都能用，任选其一。
#     location ^~ /todos/ {
#         proxy_pass            http://127.0.0.1:8086/;
#         proxy_http_version    1.1;
#         proxy_set_header      Host              $host;
#         proxy_set_header      X-Real-IP         $remote_addr;
#         proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header      X-Forwarded-Proto $scheme;
#         proxy_read_timeout    30s;
#         client_max_body_size  6m;
#     }
#     # /todos（不带尾斜杠）跳转到 /todos/（应用自身也会 301，这里在 nginx 层先处理）
#     location = /todos {
#         return 301 /todos/;
#     }
#     # 该路径下的订阅 token 不落日志（需要本文件的 map/log_format 已生效）
#     location ^~ /todos/api/calendar.ics {
#         access_log /var/log/nginx/easylife-ics.log easylife_redacted;
#         proxy_pass http://127.0.0.1:8086/api/calendar.ics;
#         proxy_set_header Host $host;
#     }
#
# 路径模式的注意事项：
#   1) 前缀剥不剥都行：应用收到 /todos/api/me 时会先剥掉 EASYLIFE_BASE_PATH 再路由；
#   2) 首页与静态资源：前端只用相对路径（./static/app.js、./api/...），在 /todos/ 下
#      会解析成 /todos/static/...、/todos/api/...，不会打到现有站点的 /static/、/api/；
#   3) 会话 Cookie 名是 easylife_session、Path=/todos、HttpOnly，只随 /todos/ 下的请求发送，
#      与 mch.wang 上其它服务的 Cookie 互不影响；
#   4) 采用路径模式时本文件的 server 块整体不需要安装，只把上面的 map/log_format
#      两段另存为 /etc/nginx/conf.d/easylife-log.conf 即可；
#   5) 无论哪种方案：应用始终只监听 127.0.0.1:8086，nginx 出问题也不会直接暴露到公网。
# ---------------------------------------------------------------------------
